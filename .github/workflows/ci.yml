# ci.yml — Continuous Integration for podcast-feed-maker-vapor.
#
# Runs lint, build, test (with coverage), and Linux build.
# Server-side only: macOS + Linux (no iOS/tvOS/watchOS/visionOS).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Lint ----------
  lint:
    name: "Lint"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Install swift-format
        run: brew install swift-format
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: swift-format
        run: swift-format lint -r Sources/ Tests/

  # ---------- Build & Test (macOS) ----------
  build-and-test:
    name: "macOS (Swift ${{ matrix.swift }})"
    runs-on: macos-26
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            xcode: "/Applications/Xcode_26.2.app"
          - swift: "6.3"
            xcode: "/Applications/Xcode_26.4.app"
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s ${{ matrix.xcode }}
      - name: Swift Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test with Coverage
        run: swift test --enable-code-coverage
      - name: Coverage Report
        run: |
          PROF_DATA=$(find .build -name "default.profdata" -type f | head -1)
          TEST_BIN=$(find .build -name "podcast-feed-maker-vaporPackageTests" -type f ! -name "*.o" -not -path "*.dSYM*" | head -1)
          if [ -n "$PROF_DATA" ] && [ -n "$TEST_BIN" ]; then
            xcrun llvm-cov report "$TEST_BIN" \
              -instr-profile="$PROF_DATA" \
              -ignore-filename-regex='\.build|Tests'
          fi
      # Coverage is exported and uploaded once, from the Swift 6.2 leg only — avoids duplicate Codecov reports.
      - name: Generate lcov Coverage
        if: matrix.swift == '6.2'
        run: |
          PROF_DATA=$(find .build -name "default.profdata" -type f | head -1)
          TEST_BIN=$(find .build -name "podcast-feed-maker-vaporPackageTests" -type f ! -name "*.o" -not -path "*.dSYM*" | head -1)
          if [ -n "$PROF_DATA" ] && [ -n "$TEST_BIN" ]; then
            xcrun llvm-cov export "$TEST_BIN" \
              -instr-profile="$PROF_DATA" \
              -format=lcov \
              -ignore-filename-regex='\.build|Tests' \
              > coverage.lcov
          fi
      - name: Upload to Codecov
        if: matrix.swift == '6.2'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------- Linux ----------
  linux:
    name: "Linux (Swift 6.2)"
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - name: Swift Version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
